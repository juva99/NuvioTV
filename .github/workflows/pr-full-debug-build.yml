name: PR Full Debug Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-full-debug-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-debug-build:
    name: Build fullDebug APK
    runs-on: ubuntu-latest
    env:
      DOVI_NATIVE_ENABLED: "true"
      DOVI_EXTRACTOR_HOOK_READY: "true"
      DOVI_ENABLE_REAL_LINK: "true"
      DOVI_LIBDOVI_PREBUILT_ROOT: DV7/libdovi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare local properties
        run: |
          # Pull-request code is untrusted. Build with empty properties instead of exposing
          # repository secrets to Gradle scripts or tests supplied by the pull request.
          : > local.properties
          : > local.dev.properties

      - name: Prepare CI signing config
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/ci-debug.jks" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/ci-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
            echo "GITHUB_ISSUE_CLIENT_ID=${{ vars.NUVIO_GITHUB_ISSUE_CLIENT_ID }}"
          } >> "$GITHUB_ENV"

      - name: Test subtitle synchronization
        run: |
          ./gradlew :app:testFullDebugUnitTest \
            --tests 'com.nuvio.tv.updater.*' \
            --tests "com.nuvio.tv.ui.screens.player.SrtDocumentTest" \
            --tests "com.nuvio.tv.ui.screens.player.SubtitleReferenceCaptureTest" \
            --tests "com.nuvio.tv.ui.screens.player.SubtitleTimingAlignerTest" \
            --tests "com.nuvio.tv.ui.screens.player.SubtitleTimingAlignerFixtureTest" \
            --tests "com.nuvio.tv.ui.screens.player.SubtitleTimingAlignerGoldenTest" \
            --tests "com.nuvio.tv.ui.screens.player.SubtitleSyncRealWorldTest" \
            --tests "com.nuvio.tv.ui.screens.player.SubtitleRateAwareAlignerTest" \
            --tests "com.nuvio.tv.data.repository.GitHubIssueReportRepositoryTest"

      - name: Build fullDebug APK
        run: ./gradlew :app:assembleFullDebug --stacktrace

      - name: Upload fullDebug APK
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-full-debug-pr-${{ github.event.pull_request.number || github.run_number }}
          path: app/build/outputs/apk/full/debug/app-full-universal-debug.apk
          if-no-files-found: error
          retention-days: 7

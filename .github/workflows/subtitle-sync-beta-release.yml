name: Subtitle Sync Beta Release

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      release_title:
        required: true
        type: string
      version_code:
        required: true
        type: number
      release_notes:
        required: true
        type: string
      release_ref:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v0.8.4-beta-subtitle-sync.13"
        required: true
        type: string
      release_title:
        description: "GitHub release title"
        required: true
        type: string
      version_code:
        description: "Android versionCode; must increase for every published build"
        required: true
        type: number
      release_notes:
        description: "Full Markdown release notes"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: subtitle-sync-beta-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
      NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
      NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
      DOVI_NATIVE_ENABLED: "true"
      DOVI_EXTRACTOR_HOOK_READY: "true"
      DOVI_ENABLE_REAL_LINK: "true"
      DOVI_LIBDOVI_PREBUILT_ROOT: DV7/libdovi

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.sha }}

      - name: Validate release inputs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta-subtitle-sync\.[0-9]+$ ]] || {
            echo "Invalid subtitle beta tag." >&2
            exit 1
          }
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || {
            echo "versionCode must be an integer." >&2
            exit 1
          }
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG"; then
            echo "Release tag already exists: $RELEASE_TAG" >&2
            exit 1
          else
            status=$?
            [[ "$status" == 2 ]] || exit "$status"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare local properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
          LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          fi
          if [ -n "$LOCAL_DEV_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_DEV_PROPERTIES_BASE64" | base64 --decode > local.dev.properties
          fi

      - name: Prepare permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NUVIO_SUBTITLE_BETA_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.NUVIO_SUBTITLE_BETA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUVIO_SUBTITLE_BETA_KEY_PASSWORD }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Permanent subtitle beta signing secrets are missing"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/subtitle-beta.jks"
          {
            echo "NUVIO_BENCHMARK_STORE_FILE=$RUNNER_TEMP/subtitle-beta.jks"
            echo "NUVIO_BENCHMARK_KEY_ALIAS=$KEY_ALIAS"
            echo "NUVIO_BENCHMARK_KEY_PASSWORD=$KEY_PASSWORD"
            echo "NUVIO_BENCHMARK_STORE_PASSWORD=$KEY_PASSWORD"
            echo "NUVIO_VERSION_NAME=$RELEASE_TAG"
            echo "NUVIO_VERSION_CODE=$VERSION_CODE"
            echo "NUVIO_GITHUB_OWNER=${{ github.repository_owner }}"
            echo "NUVIO_GITHUB_REPO=${{ github.event.repository.name }}"
            echo "GITHUB_ISSUE_OWNER=${{ github.repository_owner }}"
            echo "GITHUB_ISSUE_REPO=${{ github.event.repository.name }}"
            echo "GITHUB_ISSUE_REPOSITORY_ID=${{ github.event.repository.id }}"
            echo "GITHUB_ISSUE_CLIENT_ID=${{ vars.NUVIO_GITHUB_ISSUE_CLIENT_ID }}"
            echo "NUVIO_UPDATE_PRERELEASE_PREFIX=subtitle-sync"
          } >> "$GITHUB_ENV"

      - name: Test subtitle synchronization
        run: |
          ./gradlew :app:testFullDebugUnitTest \
            --tests "com.nuvio.tv.ui.screens.player.SrtDocumentTest" \
            --tests "com.nuvio.tv.ui.screens.player.SubtitleReferenceCaptureTest" \
            --tests "com.nuvio.tv.ui.screens.player.SubtitleReferenceScannerTest" \
            --tests "com.nuvio.tv.ui.screens.player.SubtitleRequestHeadersTest" \
            --tests "com.nuvio.tv.ui.screens.player.SubtitleTimingAlignerTest" \
            --tests "com.nuvio.tv.ui.screens.player.SubtitleTimingAlignerFixtureTest" \
            --tests "com.nuvio.tv.ui.screens.player.SubtitleTimingAlignerGoldenTest" \
            --tests "com.nuvio.tv.ui.screens.player.SubtitleSyncRealWorldTest" \
            --tests "com.nuvio.tv.ui.screens.player.SubtitleRateAwareAlignerTest" \
            --tests "com.nuvio.tv.ui.screens.player.SubtitleEpisodeSyncRegressionTest" \
            --tests "com.nuvio.tv.ui.screens.player.autosync.*" \
            --tests "com.nuvio.tv.ui.screens.player.PlayerSubtitleRtlFixTest" \
            --tests "com.nuvio.tv.data.repository.GitHubIssueReportRepositoryTest"

      - name: Build benchmark APKs
        run: ./gradlew :app:assembleFullBenchmark

      - name: Verify APKs
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/full/benchmark/*.apk)
          if [ "${#apks[@]}" -ne 5 ]; then
            printf 'Expected 5 APKs, found %s\n' "${#apks[@]}"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            unzip -l "$apk" | grep -q 'lib/.*/libdovi_bridge.so' || {
              echo "Missing libdovi_bridge.so in $apk"
              exit 1
            }
            "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" \
              verify --print-certs "$apk" | grep -q \
              '92c6b980f9ba67417eef61b2b5142daa7cd6751f974e108964fb24e0da3a8f52' || {
                echo "Unexpected signing certificate in $apk"
                exit 1
              }
          done

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TITLE: ${{ inputs.release_title }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          release_sha="$(git rev-parse HEAD)"
          branch_sha="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          if [[ "$release_sha" != "$branch_sha" ]]; then
            echo "The release branch advanced during the build. Dispatch again from its current commit; no release was published." >&2
            exit 1
          fi
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" \
            app/build/outputs/apk/full/benchmark/*.apk \
            --target "$release_sha" \
            --title "$RELEASE_TITLE" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease
